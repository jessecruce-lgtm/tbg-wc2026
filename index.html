    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    #root { min-height: 100vh; }
    input, select, button { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    ::-webkit-scrollbar-thumb { background: #9AA3AE; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6B7280; }
    select option { background: #FFFFFF; color: #111827; }
    button:focus-visible { outline: 2px solid #1A3A5C; outline-offset: 2px; }
    input:focus { border-color: #1A3A5C !important; box-shadow: 0 0 0 3px rgba(26,58,92,0.15) !important; outline: none; }
    select:focus { outline: 2px solid #1A3A5C; outline-offset: 1px; }
    * { -webkit-font-smoothing: antialiased; }
    table { border-collapse: collapse; width: 100%; }
